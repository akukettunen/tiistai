version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify console env vars are build-only unless copied into .env.production
        # for Next.js SSR / API routes (see Amplify SSR env docs).
        - env | grep -e '^MCP_TOKEN=' -e '^MCP_OWNER_ID=' -e '^SUPABASE_SECRET_KEY=' -e '^MAIL_ENCRYPTION_KEY=' -e '^NEXT_PUBLIC_' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
